<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>404 - 页面不存在</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #f0f7f4 0%, #e3ece8 100%);
      color: #1e2621;
    }
    .wrap { text-align: center; padding: 24px; }
    .icon {
      width: 88px; height: 88px;
      margin: 0 auto 28px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: #e8f5ee;
      font-size: 42px;
      user-select: none;
    }
    h1 { font-size: 88px; font-weight: 800; color: #3d9970; line-height: 1; }
    p.tip { font-size: 20px; font-weight: 600; margin: 18px 0 8px; color: #1e2621; }
    p.desc { font-size: 14px; color: #6b7a72; margin-bottom: 32px; }
    a.btn {
      display: inline-block;
      padding: 10px 34px;
      border-radius: 8px;
      background: #3d9970;
      color: #fff;
      font-size: 15px;
      text-decoration: none;
      transition: background 0.2s;
    }
    a.btn:hover { background: #348361; }
    .foot { margin-top: 36px; font-size: 12px; color: #98a29b; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="icon">🔍</div>
    <h1>404</h1>
    <p class="tip">页面不存在</p>
    <p class="desc">您访问的页面不存在或已被移除</p>
    <a class="btn" href="./">返回首页</a>
    <p class="foot">高中生物学习小程序 · 后台管理系统</p>
  </div>
</body>
</html>
