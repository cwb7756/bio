name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run node --check on all JS files
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r file; do
            node --check "$file"
            count=$((count + 1))
          done < <(git ls-files '*.js')
          echo "All $count JS files passed syntax check"
